remote_theme: just-the-docs/just-the-docs
title: UNB Ocean Mapping Group
description: Comprehensive documentation, processing workflows, QGIS plugin, and LocalAI/LLM datasets for the UNB Ocean Mapping Group (OMG) multibeam and acoustic software suite.
url: https://ocean-mapping-group.github.io

# Theme color scheme
color_scheme: dark

# Enable search and full previews
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: true

# Enable heading anchor links and back-to-top
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Aux links for the header
aux_links:
  "Processing Workflows":
    - "/workflows/"
  "Tool Finder & Cheat Sheet":
    - "/usage-guide.html"
  "QGIS Monitor & Live Demo":
    - "/qgis_plugin/bransfield-demo.html"
  "OMG on GitHub":
    - "https://github.com/ocean-mapping-group"
aux_links_new_tab: false

# Callout styling for Just the Docs
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red
